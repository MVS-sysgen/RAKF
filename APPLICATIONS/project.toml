# ====================================================================
#  RAKF administration commands - mbt v2 (cc370 host build).
#
#  Build:   make            # ADDUSER + ALTUSER load modules -> build/
#           make adduser    # just one
#           make deploy     # pack -> XMIT -> RECEIVE into the LINKLIB
#
#  Each command is its own load module.  The shared logic (rakfadm.c)
#  and the assembler primitives (getstck, RAKFPWH, RAKFHASH) live in
#  the [internal] archive; the linker autocalls exactly what each
#  command references, so ADDUSER and ALTUSER stay self-contained.
# ====================================================================

[project]
name    = "rakfadm"
version = "2.0.0"
type    = "application"

[build]
# rakfadm.h sits beside the .c sources; add its dir to the include path.
cflags = ["-I."]

# ---- shared code, compiled once, autocalled by every module --------
[internal]
sources = [
    "rakfadm.c",
    "asm/getstck.asm",
    "asm/rakfpwh.asm",     # SHA256(salt||pw) wrapper  (ported from ../SRCLIB)
    "asm/rakfhash.asm",    # SHA-256 core              (ported from ../SRCLIB)
]

# ---- one load module per command (root main() only) ----------------
#
# norent: ld370's template marks every module RENT+REUS, but these are C
# programs with mutable statics -- libc370 assigns stdout during startup,
# and rakfadm.c caches the resolved dataset names. A module marked
# reentrant can be loaded into read-only storage, and TSO does exactly
# that for a command processor: entering ADDUSER at READY took an S0C4
# with interrupt code 4 (protection exception) on the first static store,
# while CALL and batch -- which load it differently -- worked. Serially
# reusable (REUS) is kept and is honest: cmd_parse resets the state.
[[module]]
name    = "ADDUSER"
sources = ["adduser.c"]
norent  = true

[[module]]
name    = "ALTUSER"
sources = ["altuser.c"]
norent  = true

# ---- C runtime (crt0 startup + libc370) ----------------------------
[dependencies]
"mvslovers/crent370" = ">=1.0.0"

# ---- where 'make deploy' installs the load modules -----------------
#  mbt deploy DELETEs+recreates the target LINKLIB, so it must be a
#  DEDICATED dataset -- never a shared library.  Production install into
#  SYS2.CMDLIB is a separate additive IEBCOPY step from here.
[deploy]
target = "IBMUSER.RAKFADM.LINKLIB"

[artifacts]
loads = true
